name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-roboto

      - name: Build
        run: dotnet build Bitbeans.Zpl.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test with coverage
        shell: pwsh
        run: ./eng/coverage.ps1 -NoBuild

      - name: Pack
        run: dotnet pack Bitbeans.Zpl.slnx --configuration Release --no-build --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*
          generate_release_notes: true
