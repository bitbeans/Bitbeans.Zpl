name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write  # GitHub release
  id-token: write  # NuGet trusted publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-roboto

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Bitbeans.Zpl.slnx --configuration Release "-p:Version=$VERSION"

      - name: Test with coverage
        shell: pwsh
        run: ./eng/coverage.ps1 -NoBuild

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Deterministic packages: fixed entry timestamps from the tagged commit
          # (https://learn.microsoft.com/en-us/nuget/create-packages/deterministic-packages)
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          dotnet pack Bitbeans.Zpl.slnx --configuration Release --no-build --output artifacts/packages "-p:Version=$VERSION"

      # Trusted publishing: nuget.org exchanges the GitHub OIDC token for a short-lived API key,
      # no long-lived secret is stored. Policy: nuget.org > Trusted Publishing (owner bitbeans,
      # repository Bitbeans.Zpl, workflow release.yml, environment nuget).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: bitbeans

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/packages/*
          generate_release_notes: true
