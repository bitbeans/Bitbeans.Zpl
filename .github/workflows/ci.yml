name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # weekly: new advisories and deprecations without code changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-roboto

      - name: Restore
        run: dotnet restore Bitbeans.Zpl.slnx

      - name: Build
        run: dotnet build Bitbeans.Zpl.slnx --configuration Release --no-restore

      - name: Test with coverage
        shell: pwsh
        run: ./eng/coverage.ps1 -NoBuild

      - name: Coverage summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/coverage/
          if-no-files-found: ignore

      - name: Pack
        if: runner.os == 'Linux'
        run: |
          # Deterministic packages: fixed entry timestamps from the commit
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          dotnet pack Bitbeans.Zpl.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/

  packages:
    name: Package audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check vulnerabilities, deprecations and licenses
        shell: pwsh
        run: ./eng/check-packages.ps1
