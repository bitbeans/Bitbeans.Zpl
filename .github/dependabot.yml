version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      skiasharp:
        patterns: ['SkiaSharp*', 'HarfBuzzSharp*']
      test:
        patterns: ['MSTest*', 'Microsoft.NET.Test.Sdk', 'coverlet*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
