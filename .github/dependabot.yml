version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      skiasharp:
        patterns: ['SkiaSharp*', 'HarfBuzzSharp*']
      test:
        patterns: ['MSTest*', 'Microsoft.NET.Test.Sdk', 'coverlet*']
    ignore:
      # Keep Microsoft.Extensions.* on the major version that matches the target framework (net10.0),
      # so consumers are not forced onto a newer major version
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
